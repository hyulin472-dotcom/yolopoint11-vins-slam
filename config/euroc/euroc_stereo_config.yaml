%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 0         
num_of_cam: 2  

imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "output/euroc_stereo/"

cam0_calib: "cam0_mei.yaml"
cam1_calib: "cam1_mei.yaml"
image_width: 752
image_height: 480
   

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
           0.999557249008, 0.0149672133247, 0.025715529948,  -0.064676986768,
           -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
           0, 0, 0, 1]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0125552670891, -0.999755099723, 0.0182237714554, -0.0198435579556,
           0.999598781151, 0.0130119051815, 0.0251588363115, 0.0453689425024,
          -0.0253898008918, 0.0179005838253, 0.999517347078, 0.00786212447038,
          0, 0, 0, 1]

#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
feature_tracker_type: 0 # 0: LK, 3: YOLOPointv11 + LightGlue + stereo KLT
min_dist: 30            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

# Independent RTAB-Map-inspired loop closure (no RTAB-Map dependency)
loop_closure_enable: false
loop_closure_max_features: 800
loop_closure_keyframe_stride: 5
loop_closure_stm_size: 10
loop_closure_max_database_size: 2000
loop_closure_appearance_threshold: 0.08
loop_closure_match_ratio: 0.75
loop_closure_temporal_consistency: 2
loop_closure_candidate_window: 4
loop_closure_min_matches: 30
loop_closure_min_inliers: 20
loop_closure_min_f_inliers: 20
loop_closure_min_f_inlier_ratio: 0.35
loop_closure_f_ransac_threshold: 1.5
loop_closure_min_grid_cells: 6
loop_closure_min_inlier_ratio: 0.35
loop_closure_min_inlier_spread: 0.12
loop_closure_pnp_iterations: 150
loop_closure_pnp_reprojection_error: 3.0
loop_closure_min_depth: 0.2
loop_closure_max_depth: 30.0
loop_closure_stereo_max_error: 0.08
loop_closure_max_translation: 20.0
loop_closure_max_rotation_deg: 60.0
loop_closure_pose_graph_iterations: 30
loop_closure_max_pending_keyframes: 5
loop_closure_min_interval: 6
loop_closure_neighbor_edges: 4
loop_closure_allow_stereo_fallback: true
loop_closure_odom_translation_weight: 5.0
loop_closure_odom_rotation_weight: 10.0
loop_closure_loop_translation_weight: 8.0
loop_closure_loop_rotation_weight: 12.0
loop_closure_graph_max_translation_error: 2.0
loop_closure_graph_max_rotation_error_deg: 20.0
loop_closure_dual_max_translation_error: 1.5
loop_closure_dual_max_rotation_error_deg: 10.0
loop_closure_gravity_weight: 50.0
